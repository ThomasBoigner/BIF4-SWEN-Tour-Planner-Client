# Docker
# Build a Docker image
# https://docs.microsoft.com/azure/devops/pipelines/languages/docker

trigger:
  branches:
    include:
      - main

resources:
- repo: self

variables:
  tag: '$(Build.BuildId)'

stages:
- stage: Test
  displayName: Test Application
  jobs:
    - job: Test
      displayName: testing
      pool:
        vmImage: ubuntu-latest
      steps:
      - script: |
          npm cache clean --force
          npm install -g npm
          npm install -g @angular/cli
          npm install -g @angular-devkit/build-angular --force
          rm -rf node_modules package-lock.json
          npm install --force
        displayName: Install npm packages

      - script: |
          CHROME_PATH=$(which google-chrome || which chromium-browser)
          if [ -z "$CHROME_PATH" ]; then
            echo "Error: Chrome or Chromium is not installed on your system."
            exit 1
          fi
          export CHROME_BIN="$CHROME_PATH"
          echo "Running Angular tests"
          npm run test:ci
        displayName: Run Angular tests for remote
        continueOnError: true

- stage: Build_Push
  displayName: Build & Push image
  jobs:
  - job: Build
    displayName: Build & Push
    steps:
    - task: AzureCLI@2
      inputs:
        azureSubscription: 'tour-planner-main'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          az acr login --name $(containerRegistry)
                          
          docker build -t $(containerRegistry).azurecr.io/$(imageRepository):$(tag) .
          docker tag $(containerRegistry).azurecr.io/$(imageRepository):$(tag) $(containerRegistry).azurecr.io/$(imageRepository):latest
          
          docker push $(containerRegistry).azurecr.io/$(imageRepository):$(tag)
          docker push $(containerRegistry).azurecr.io/$(imageRepository):latest

- stage: Deploy
  displayName: 'Deploy'
  jobs:
    - job: RestartContainer
      steps:
        - task: AzureCLI@2
          displayName: 'Restart Container to pull new image'
          inputs:
            azureSubscription: 'tour-planner-main'
            scriptType: 'bash'
            scriptLocation: 'inlineScript'
            inlineScript: |
              az container restart \
                --resource-group $(resource-group) \
                --name $(resource-name)